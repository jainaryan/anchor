[project]
name = "mindmate"
version = "0.1.0"
description = "Llama 3.2 3B mental health support fine-tuning"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch==2.5.1",
    "torchaudio==2.5.1",
    "torchvision==0.20.1",
    "transformers>=4.45.0",
    "peft>=0.12.0",
    "bitsandbytes>=0.43.0",
    "datasets>=3.0.0",
    "accelerate>=1.0.0",
    "pandas>=2.0.0",
    "huggingface-hub",
    "tokenizers",
    "tqdm",
    "unsloth>=2026.1.4",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }
torchaudio = { index = "pytorch-cu121" }
