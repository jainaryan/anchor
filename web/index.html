<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anchor Chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="brand">
                <div class="logo-icon">⚓</div>
                <h1>Anchor</h1>
            </div>
            <button class="new-chat-btn" onclick="startNewChat()">+ New Chat</button>

            <div class="history">
                <p class="history-label">Recent</p>
                <div id="history-list">
                    <!-- History items will be populated here -->
                </div>
            </div>

            <div class="user-profile">
                <div class="avatar">A</div>
                <div class="user-info">
                    <span class="name">Guest User</span>
                    <span class="status">Free Plan</span>
                </div>
            </div>

            <button id="reset-btn" class="reset-btn" onclick="resetMemory()" title="Hard Reset Memory">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                    <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z" />
                </svg>
                Reset Memory
            </button>
        </aside>

        <!-- Main Chat Area -->
        <main class="chat-interface">
            <header class="chat-header">
                <h2>Anchor</h2>
                <button id="finish-btn" class="finish-btn" onclick="endSession()">Finish & Analyze</button>
            </header>

            <div id="chat-container" class="chat-container">
                <div class="message ai-message">
                    <div class="message-content">
                        Hello! I'm MindMate, your empathetic companion. How are you feeling today?
                    </div>
                </div>
            </div>

            <div class="input-area">
                <div class="input-wrapper">
                    <button id="mic-btn" class="mic-btn" title="Speak">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                            <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.66 9 5v6c0 1.66 1.34 3 3 3z" />
                            <path
                                d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z" />
                        </svg>
                    </button>
                    <textarea id="user-input" placeholder="Type your message..." rows="1"></textarea>
                    <button id="send-btn" disabled>
                        <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
                        </svg>
                    </button>
                </div>
                <p class="disclaimer">MindMate can make mistakes. Consider checking important information.</p>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>

</html>
